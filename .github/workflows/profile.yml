name: profile · telemetry

on:
  schedule:
    - cron: "17 3 * * *"      # daily, off-peak
  workflow_dispatch:          # allows manual refresh from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: regenerate telemetry panels
        run: python scripts/generate_telemetry.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/panel-telemetry.svg assets/panel-signal.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "telemetry: refresh signal panels [skip ci]"
            git push
          fi

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <rect width="1600" height="300" fill="#0d1117"/>
  <line x1="0" y1="1" x2="1600" y2="1" stroke="#1e1e22" stroke-width="1"/>

  <!-- architecture chain -->
  <g font-size="14" letter-spacing="2.5" fill="#9c9ca4">
    <rect x="282" y="62" width="104" height="40" rx="20" fill="none" stroke="#33333a" stroke-width="1.2"/>
    <text x="334" y="87" text-anchor="middle">IDEA</text>
    <text x="412" y="87" fill="#484850">→</text>
    <rect x="442" y="62" width="124" height="40" rx="20" fill="none" stroke="#33333a" stroke-width="1.2"/>
    <text x="504" y="87" text-anchor="middle">SYSTEM</text>
    <text x="592" y="87" fill="#484850">→</text>
    <rect x="622" y="62" width="144" height="40" rx="20" fill="none" stroke="#33333a" stroke-width="1.2"/>
    <text x="694" y="87" text-anchor="middle">INTERFACE</text>
    <text x="792" y="87" fill="#484850">→</text>
    <rect x="822" y="62" width="104" height="40" rx="20" fill="none" stroke="#33333a" stroke-width="1.2"/>
    <text x="874" y="87" text-anchor="middle">TOOL</text>
    <text x="952" y="87" fill="#484850">→</text>
    <rect x="982" y="62" width="104" height="40" rx="20" fill="none" stroke="#33333a" stroke-width="1.2"/>
    <text x="1034" y="87" text-anchor="middle">USER</text>
  </g>
  <text x="800" y="140" text-anchor="middle" font-size="11" letter-spacing="3" fill="#3f3f46">ARCHITECTURE — inspect the system</text>

  <text x="800" y="212" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" letter-spacing="12" fill="#6d6d75">MAGGIO · SYSTEMS LAB</text>

  <text x="800" y="256" text-anchor="middle" font-size="11.5" letter-spacing="2" fill="#3f3f46">designed in ink <tspan font-family="'Songti SC','Noto Serif CJK SC','Source Han Serif SC',STSong,serif">水墨</tspan> · built as pure svg · no widgets, no trackers</text>

  <!-- crosshair bottom-left -->
  <g stroke="#33333a" stroke-width="1.2" fill="none">
    <circle cx="64" cy="248" r="12"/>
    <line x1="64" y1="230" x2="64" y2="266"/>
    <line x1="46" y1="248" x2="82" y2="248"/>
  </g>

  <!-- seal bottom-right -->
  <rect x="1508" y="226" width="44" height="44" rx="5" fill="#a93226"/>
  <text x="1530" y="243" text-anchor="middle" font-family="'Songti SC','Noto Serif CJK SC','Source Han Serif SC',STSong,serif" font-size="17" fill="#f6e9dd">黑</text>
  <text x="1530" y="262" text-anchor="middle" font-family="'Songti SC','Noto Serif CJK SC','Source Han Serif SC',STSong,serif" font-size="17" fill="#f6e9dd">石</text>
</svg>
